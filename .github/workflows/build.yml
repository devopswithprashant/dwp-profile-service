name: Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write 


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false


env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY || 'dwp-profile-service' }}

jobs:
  scala:
    name: Compile and Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: profiledb_test
          POSTGRES_USER: profileuser_test
          POSTGRES_PASSWORD: profiletestpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U profileuser_test -d profiledb_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PROFILE_TEST_DB_HOST: localhost
      PROFILE_TEST_DB_PORT: 5432
      PROFILE_TEST_DB_NAME: profiledb_test
      PROFILE_TEST_DB_USER: profileuser_test
      PROFILE_TEST_DB_PASSWORD: profiletestpassword
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: sbt

      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      - name: Compile
        run: sbt clean compile

      - name: Run tests
        #run: sbt clean coverage test coverageReport
        run: sbt clean test


      

