name: Build

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
  DOCKERHUB_REPOSITORY: 'dwp-np-profile-service'
  GIT_USER_NAME: "ci-bot"
  GIT_USER_EMAIL: "ci-bot@devopswithprashant.com"
  GITOPS_BRANCH_NAME: "feat/profile-integration"  # <- change to your gitops branch name or set as repo variable


jobs:
  scala:
    name: Compile and Test
    if: ${{ !startsWith(github.event.head_commit.message, '[SBT Release Plugin]') }}
    runs-on: ubuntu-latest
    outputs:
      projectVersion: ${{ steps.project_version.outputs.version }}
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: profiledb_test
          POSTGRES_USER: profileuser_test
          POSTGRES_PASSWORD: profiletestpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U profileuser_test -d profiledb_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PROFILE_TEST_DB_HOST: localhost
      PROFILE_TEST_DB_PORT: 5432
      PROFILE_TEST_DB_NAME: profiledb_test
      PROFILE_TEST_DB_USER: profileuser_test
      PROFILE_TEST_DB_PASSWORD: profiletestpassword
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: sbt

      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      - name: Compile
        run: sbt clean compile

      - name: Extract sbt project version
        id: project_version
        run: |
          VERSION=$(sbt -batch -error 'print version' | awk '/^[[:alnum:]][[:alnum:].+_-]*$/ { version = $0 } END { if (version == "") exit 1; print version }')
          printf 'version=%s\n' "$VERSION" >> "$GITHUB_OUTPUT"

      - name: Run tests
        run: sbt clean coverage test coverageReport

      - name: Test Sonar coverage conversion
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

      - name: Convert Scoverage report for SonarQube
        run: |
          python3 scripts/scoverage_to_sonar.py \
            target/scala-3.3.8/scoverage-report/scoverage.xml \
            target/sonar/coverage.xml

      - name: Analyze with SonarQube
        uses: SonarSource/sonarqube-scan-action@v8.4.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectVersion=${{ steps.project_version.outputs.version }}


  docker:
    name: Publish image to Docker Hub
    needs: scala
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            docker.io/${{ env.DOCKERHUB_USERNAME }}/${{ env.DOCKERHUB_REPOSITORY }}:${{ needs.scala.outputs.projectVersion }}-${{ github.sha }}
            docker.io/${{ env.DOCKERHUB_USERNAME }}/${{ env.DOCKERHUB_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'docker.io/${{ env.DOCKERHUB_USERNAME }}/${{ env.DOCKERHUB_REPOSITORY }}:${{ needs.scala.outputs.projectVersion }}-${{ github.sha }}'
          format: 'table'
          exit-code: '1'          # Fails the pipeline if vulnerabilities are found
          ignore-unfixed: true     # Optional: ignore CVEs without an available fix
          severity: 'CRITICAL'
  
  deploy-DEV:
    needs: [scala, docker]
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
    # Checkout the repository to the GitHub Actions runner
      - name: Checkout gitops repo
        uses: actions/checkout@v7
        with:
          repository: "devopswithprashant/k8-dwp"
          token: ${{ secrets.GHEC_TOKEN_K8 }}
          ref: ${{ env.GITOPS_BRANCH_NAME }}
          fetch-depth: 10

      - name: Update image tag in target file
        #working-directory: gitops
        id: update
        env:
          FILE: "env/dev/profile-deployment.yaml"
          IMAGE: "docker.io/${{ env.DOCKERHUB_USERNAME }}/${{ env.DOCKERHUB_REPOSITORY }}"
          NEW_TAG: ${{ needs.scala.outputs.projectVersion }}-${{ github.sha }}

        run: |
          set -euo pipefail
          if [ ! -f "$FILE" ]; then
            echo "ERROR target file not found: $FILE"
            exit 1
          fi
          NEW_IMAGE="${IMAGE}:${NEW_TAG}"
          sed -E -i "s#docker\.io/[^/[:space:]]+/dwp(-np)?-profile-service:[^[:space:]]+#${NEW_IMAGE}#g" "$FILE"
          # Git config
          git config user.name "${GIT_USER_NAME}"
          git config user.email "${GIT_USER_EMAIL}"
          # Check if file actually changed before committing
          if git diff --quiet -- "$FILE"; then
            echo "✅ No changes detected in $FILE — skipping commit & push."
            exit 0
          fi
          git add "$FILE"
          if git diff --cached --quiet; then
            echo "✅ Nothing new to commit — skipping push."
            exit 0
          fi
          git commit -m "chore(DEV): bump new version ${NEW_TAG} of profile image ${IMAGE}"
          git push origin ${{ env.GITOPS_BRANCH_NAME }}