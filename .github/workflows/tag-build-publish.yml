name: Tag build & publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
  DOCKERHUB_REPOSITORY: 'dwp-profile-service'

jobs:
  scala:
    name: Compile and Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: profiledb_test
          POSTGRES_USER: profileuser_test
          POSTGRES_PASSWORD: profiletestpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U profileuser_test -d profiledb_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PROFILE_TEST_DB_HOST: localhost
      PROFILE_TEST_DB_PORT: 5432
      PROFILE_TEST_DB_NAME: profiledb_test
      PROFILE_TEST_DB_USER: profileuser_test
      PROFILE_TEST_DB_PASSWORD: profiletestpassword
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify tag points to a commit on main
        run: |
          git fetch origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Release tags must point to a commit on main."
            exit 1
          fi

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: sbt

      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      - name: Compile
        run: sbt clean compile

      - name: Run tests
        run: sbt clean coverage test coverageReport

  docker:
    name: Publish image to Docker Hub
    needs: scala
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: docker.io/${{ env.DOCKERHUB_USERNAME }}/${{ env.DOCKERHUB_REPOSITORY }}:${{ github.ref_name }}
          cache-from: type=gha,scope=profile-service-image
          cache-to: type=gha,mode=max,scope=profile-service-image
