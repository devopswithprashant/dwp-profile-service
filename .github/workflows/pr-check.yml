# This workflow will build a package using Maven and then publish it to GitHub packages when a release is created
# For more information see: https://github.com/actions/setup-java/blob/main/docs/advanced-usage.md#apache-maven-with-a-settings-path

name: PR build check

on:
  pull_request_target: # Loads this workflow file from the base branch (e.g. main)
    types: [opened, synchronize, reopened]

permissions:
  contents: read



concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false





jobs:
  scala:
    name: Compile and Test
    runs-on: ubuntu-latest
    outputs:
      projectVersion: ${{ steps.project_version.outputs.version }}
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: profiledb_test
          POSTGRES_USER: profileuser_test
          POSTGRES_PASSWORD: profiletestpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U profileuser_test -d profiledb_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PROFILE_TEST_DB_HOST: localhost
      PROFILE_TEST_DB_PORT: 5432
      PROFILE_TEST_DB_NAME: profiledb_test
      PROFILE_TEST_DB_USER: profileuser_test
      PROFILE_TEST_DB_PASSWORD: profiletestpassword
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: sbt

      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      - name: Extract sbt project version
        id: project_version
        run: |
          VERSION=$(sbt -batch -error 'print version' | awk '/^[[:alnum:]][[:alnum:].+_-]*$/ { version = $0 } END { if (version == "") exit 1; print version }')
          printf 'version=%s\n' "$VERSION" >> "$GITHUB_OUTPUT"

      - name: Compile
        run: sbt clean compile

      - name: Run tests
        run: sbt clean coverage test coverageReport

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          platforms: linux/arm64
          tags: |
            dwp-profile-service:${{ github.sha }}
          # Optional: use GitHub Actions cache for build layers (fast incremental builds)
          #cache-from: type=gha
          #cache-to: type=gha,mode=max
      
      
