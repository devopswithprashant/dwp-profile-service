syntax = "proto3";

package dwp.profileservice.v1;

option java_package = "com.devopswithprashant.profile.v1";
option java_multiple_files = true;
option java_outer_classname = "ProfileServiceProto";

service ProfileService {
  rpc CreateDefaultProfile(CreateDefaultProfileRequest)
      returns (CreateDefaultProfileResponse);
}

message CreateDefaultProfileRequest {
  string user_id = 1;
}

message CreateDefaultProfileResponse {
  string user_id = 1;
}
